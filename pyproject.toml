[project]
name = "technician-coach-llm"
version = "0.1.0"
description = "An LLM troubleshooting coach for maintenance technicians on a fictional plant. Technician and supervisor outputs are separated in code, and a deterministic mock mode needs no API key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.scripts]
technician-coach = "technician_coach.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technician_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # prompts and data tables contain long literal lines
